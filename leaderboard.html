
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team11 - Leaderboard</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fa;
  color:#17243b;
}
header{
  background:#101d36;
  color:white;
  padding:20px;
}
header h2{margin:0}
header p{margin:6px 0 0;color:#cbd5e1}
.container{padding:18px;max-width:650px;margin:auto}
.card{
  background:white;
  border-radius:15px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #17243b0d;
}
.summary{
  display:flex;
  gap:12px;
}
.summary .card{flex:1;text-align:center}
.number{font-size:25px;font-weight:bold;color:#e63946}
.small{font-size:12px;color:#718096}
h3{margin-top:0}
.rank-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #edf0f4;
}
.rank-row:last-child{border:0}
.rank{
  width:35px;
  font-weight:bold;
  font-size:18px;
  color:#e63946;
}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:#e8edf7;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;color:#17243b;
}
.player{flex:1}
.player strong{display:block}
.points{font-weight:bold;color:#17243b}
.you{
  background:#fff1f1;
  margin:0 -8px;
  padding:12px 8px;
  border-radius:10px;
}
button{
  border:0;
  background:#e63946;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  font-weight:bold;
  width:100%;
  margin-top:10px;
}
nav{
  display:flex;
  gap:8px;
  padding:12px;
  background:white;
  position:sticky;
  bottom:0;
}
nav a{
  flex:1;text-align:center;text-decoration:none;
  color:#17243b;font-size:13px;font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h2>🏆 Team11 Leaderboard</h2>
  <p>Check your virtual points ranking</p>
</header>

<div class="container">

  <div class="summary">
    <div class="card">
      <div class="small">Your Virtual Points</div>
      <div class="number" id="myPoints">10,000</div>
    </div>
    <div class="card">
      <div class="small">Your Saved Teams</div>
      <div class="number" id="teamCount">0</div>
    </div>
  </div>

  <div class="card">
    <h3>🏅 Overall Rankings</h3>
    <div id="leaderboard"></div>
  </div>

  <div class="card">
    <h3>📋 Your Teams</h3>
    <div id="myTeamList">No saved teams yet.</div>
  </div>

  <button onclick="location.href='index.html'">Back to Home</button>

</div>

<nav>
  <a href="index.html">Home</a>
  <a href="my-teams.html">My Teams</a>
  <a href="leaderboard.html">Ranks</a>
</nav>

<script>
function loadLeaderboard(){

  let teams = [];

  try{
    teams = JSON.parse(localStorage.getItem("team11_teams")) || [];
  }catch(error){
    teams = [];
  }

  // Virtual points are currently local demo data.
  let myPoints = Number(localStorage.getItem("team11_points")) || 10000;

  document.getElementById("myPoints").textContent =
    myPoints.toLocaleString("en-IN");

  document.getElementById("teamCount").textContent = teams.length;

  // Demo players; these are not real users.
  let players = [
    {name:"Rahul",points:12500},
    {name:"Aman",points:11800},
    {name:"Cricket Star",points:11200},
    {name:"You",points:myPoints,you:true},
    {name:"Rohit",points:9500},
    {name:"King11",points:8900}
  ];

  players.sort((a,b)=>b.points-a.points);

  let html = "";

  players.forEach((p,index)=>{
    html += `
      <div class="rank-row ${p.you ? "you" : ""}">
        <div class="rank">#${index+1}</div>
        <div class="avatar">${p.name.charAt(0)}</div>
        <div class="player">
          <strong>${p.name} ${p.you ? "(You)" : ""}</strong>
          <span class="small">${p.you ? "Your account" : "Demo user"}</span>
        </div>
        <div class="points">${p.points.toLocaleString("en-IN")}</div>
      </div>
    `;
  });

  document.getElementById("leaderboard").innerHTML = html;

  let teamHTML = "";

  if(teams.length === 0){
    teamHTML = "No saved teams yet.";
  }else{
    teams.forEach((team,index)=>{
      let matchName = team.match || "Saved Match";
      let playerCount = Array.isArray(team.players) ? team.players.length : 0;

      teamHTML += `
        <div class="rank-row">
          <div class="rank">${index+1}</div>
          <div class="player">
            <strong>${matchName}</strong>
            <span class="small">${playerCount} players selected</span>
          </div>
          <div class="points">Saved</div>
        </div>
      `;
    });
  }

  document.getElementById("myTeamList").innerHTML = teamHTML;
}

loadLeaderboard();
</script>

</body>
</html>

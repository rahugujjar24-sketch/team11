
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101d3a">
<title>Build Your Team - Team11</title>

<style>
:root {
  --navy:#101d3a;
  --red:#ed2945;
  --bg:#f3f5f9;
  --muted:#788398;
  --green:#159b68;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:var(--bg);color:#18243c;padding-bottom:95px}
button{border:0;cursor:pointer;font-weight:bold}
.header{background:var(--navy);color:white;padding:17px;border-radius:0 0 20px 20px}
.header-row{display:flex;align-items:center;gap:14px}
.back{background:#263653;color:white;width:37px;height:37px;border-radius:50%;font-size:20px}
.header h2{font-size:18px}
.header p{font-size:11px;color:#c0cada;margin-top:5px}
.match-info{display:flex;justify-content:space-between;margin-top:18px;background:#263653;padding:12px;border-radius:11px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:15px}
.stat{background:white;padding:12px 5px;border-radius:12px;text-align:center}
.stat small{color:var(--muted);font-size:10px}
.stat h3{font-size:19px;margin-top:5px}
.progress{height:5px;background:#e4e8ef;border-radius:10px;margin:0 15px 14px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--red);transition:.2s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 15px 13px}
.tab{background:white;color:#657187;padding:11px 17px;border-radius:22px;white-space:nowrap;font-size:12px}
.tab.active{background:var(--navy);color:white}
.section-title{padding:5px 15px 12px;display:flex;justify-content:space-between;align-items:center}
.section-title h3{font-size:15px}
.section-title small{font-size:10px;color:var(--muted)}
.player{background:white;margin:0 15px 9px;padding:12px;border-radius:12px;display:flex;align-items:center;gap:10px;border:1px solid #edf0f4}
.avatar{width:42px;height:42px;border-radius:50%;background:#eef1f7;display:grid;place-items:center;font-size:22px}
.player-info{flex:1;min-width:0}
.player-info strong{font-size:13px}
.player-info small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.credit{text-align:center;font-size:12px;font-weight:bold;min-width:37px}
.credit small{display:block;color:var(--muted);font-size:9px;font-weight:normal;margin-top:3px}
.add{width:31px;height:31px;border-radius:50%;background:#eaf0ff;color:#3156a2;font-size:19px}
.add.selected{background:#e8f8f1;color:var(--green)}
.ground{margin:5px 15px 16px;border-radius:16px;background:linear-gradient(160deg,#167d59,#07583f);padding:15px 10px;color:white;min-height:215px;position:relative;overflow:hidden}
.ground:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff55;border-radius:50%}
.ground h4{text-align:center;font-size:11px;position:relative;margin-bottom:12px;color:#d5f7e8}
.lineup{position:relative;display:flex;justify-content:space-around;gap:5px;margin:15px 0}
.slot{text-align:center;width:24%;font-size:9px;min-height:37px}
.slot span{display:block;font-size:20px}
.slot b{display:block;margin-top:3px;overflow-wrap:anywhere}
.footer{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px 15px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -3px 16px #17233a12;z-index:5}
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.footer small{font-size:10px;color:var(--muted)}
.footer strong{display:block;font-size:14px;margin-top:4px}
.save{background:var(--red);color:white;padding:14px 22px;border-radius:10px;font-size:12px}
.save:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
@media(min-width:650px){main{max-width:650px;margin:auto}}
</style>
</head>

<body>

<header class="header">
  <div class="header-row">
    <button class="back" onclick="history.back()">‹</button>
    <div>
      <h2>Create Your Team</h2>
      <p>Choose 11 players for your fantasy team</p>
    </div>
  </div>
  <div class="match-info">
    <strong id="matchName">MUM vs CHE</strong>
    <span>Practice Match · Demo</span>
  </div>
</header>

<div class="stats">
  <div class="stat"><small>PLAYERS</small><h3 id="playerCount">0/11</h3></div>
  <div class="stat"><small>CREDITS LEFT</small><h3 id="creditsLeft">100</h3></div>
  <div class="stat"><small>MAX FROM ONE SIDE</small><h3 id="sideCount">7</h3></div>
</div>

<div class="progress"><div id="progressBar"></div></div>

<section class="ground">
  <h4>YOUR TEAM · FIELD VIEW</h4>
  <div class="lineup" id="wicketkeepers"></div>
  <div class="lineup" id="batters"></div>
  <div class="lineup" id="allrounders"></div>
  <div class="lineup" id="bowlers"></div>
</section>

<div class="tabs">
  <button class="tab active" onclick="setRole('ALL',this)">ALL</button>
  <button class="tab" onclick="setRole('WK',this)">WK</button>
  <button class="tab" onclick="setRole('BAT',this)">BAT</button>
  <button class="tab" onclick="setRole('AR',this)">AR</button>
  <button class="tab" onclick="setRole('BOWL',this)">BOWL</button>
</div>

<div class="section-title">
  <h3>Select Players</h3>
  <small>Sample player data</small>
</div>

<div id="playerList"></div>

<div class="footer">
  <div class="footer-row">
    <div>
      <small>YOUR SELECTED TEAM</small>
      <strong id="footerCount">0 / 11 Players</strong>
    </div>
    <button class="save" id="saveButton" onclick="saveTeam()" disabled>SAVE TEAM</button>
  </div>
</div>

<script>
const players = [
 {id:1,name:"Player One",team:"MUM",role:"WK",credit:9.0,icon:"🧤"},
 {id:2,name:"Player Two",team:"CHE",role:"WK",credit:8.5,icon:"🧤"},
 {id:3,name:"Player Three",team:"MUM",role:"BAT",credit:9.5,icon:"🏏"},
 {id:4,name:"Player Four",team:"CHE",role:"BAT",credit:9.0,icon:"🏏"},
 {id:5,name:"Player Five",team:"MUM",role:"BAT",credit:8.5,icon:"🏏"},
 {id:6,name:"Player Six",team:"CHE",role:"BAT",credit:8.0,icon:"🏏"},
 {id:7,name:"Player Seven",team:"MUM",role:"BAT",credit:8.0,icon:"🏏"},
 {id:8,name:"Player Eight",team:"CHE",role:"AR",credit:9.0,icon:"⚡"},
 {id:9,name:"Player Nine",team:"MUM",role:"AR",credit:8.5,icon:"⚡"},
 {id:10,name:"Player Ten",team:"CHE",role:"AR",credit:8.0,icon:"⚡"},
 {id:11,name:"Player Eleven",team:"MUM",role:"BOWL",credit:9.0,icon:"🎯"},
 {id:12,name:"Player Twelve",team:"CHE",role:"BOWL",credit:8.5,icon:"🎯"},
 {id:13,name:"Player Thirteen",team:"MUM",role:"BOWL",credit:8.0,icon:"🎯"},
 {id:14,name:"Player Fourteen",team:"CHE",role:"BOWL",credit:8.0,icon:"🎯"},
 {id:15,name:"Player Fifteen",team:"MUM",role:"BOWL",credit:7.5,icon:"🎯"},
 {id:16,name:"Player Sixteen",team:"CHE",role:"BAT",credit:7.5,icon:"🏏"},
 {id:17,name:"Player Seventeen",team:"MUM",role:"AR",credit:7.5,icon:"⚡"},
 {id:18,name:"Player Eighteen",team:"CHE",role:"WK",credit:7.5,icon:"🧤"}
];

let selected = [];
let activeRole = "ALL";

const params = new URLSearchParams(location.search);
const match = params.get("match") || "MUM-CHE";
document.getElementById("matchName").textContent = match.replace("-"," vs ");

function roleCount(role) {
 return selected.filter(id => players.find(p=>p.id===id).role===role).length;
}

function sideCount(team) {
 return selected.filter(id => players.find(p=>p.id===id).team===team).length;
}

function canAdd(p) {
 if(selected.length>=11) return false;
 if(selected.includes(p.id)) return true;
 if(selected.reduce((sum,id)=>sum+players.find(x=>x.id===id).credit,0)+p.credit>100) return false;
 if(sideCount(p.team)>=7) return false;

 const limits = {WK:4,BAT:6,AR:4,BOWL:6};
 if(roleCount(p.role)>=limits[p.role]) return false;
 return true;
}

function togglePlayer(id) {
 const p = players.find(x=>x.id===id);
 if(selected.includes(id)) {
   selected = selected.filter(x=>x!==id);
 } else {
   if(!canAdd(p)) {
     alert("Selection limit reached. Check players, credits and team limits.");
     return;
   }
   selected.push(id);
 }
 render();
}

function setRole(role,button) {
 activeRole=role;
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 button.classList.add("active");
 renderPlayers();
}

function renderPlayers() {
 const list = document.getElementById("playerList");
 const filtered = players.filter(p=>activeRole==="ALL"||p.role===activeRole);
 list.innerHTML = "";

 filtered.forEach(p=>{
  const chosen=selected.includes(p.id);
  const row=document.createElement("div");
  row.className="player";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=p.icon;

  const info=document.createElement("div");
  info.className="player-info";
  const name=document.createElement("strong");
  name.textContent=p.name;
  const detail=document.createElement("small");
  detail.textContent=p.team+" · "+p.role;
  info.append(name,detail);

  const credit=document.createElement("div");
  credit.className="credit";
  credit.innerHTML=p.credit.toFixed(1)+"<small>Credits</small>";

  const add=document.createElement("button");
  add.className="add"+(chosen?" selected":"");
  add.textContent=chosen?"✓":"+";
  add.onclick=()=>togglePlayer(p.id);

  row.append(avatar,info,credit,add);
  list.appendChild(row);
 });

 if(!filtered.length) list.innerHTML='<div class="empty">No players found</div>';
}

function renderGround() {
 const groups = {
  WK:"wicketkeepers",
  BAT:"batters",
  AR:"allrounders",
  BOWL:"bowlers"
 };

 Object.keys(groups).forEach(role=>{
  const box=document.getElementById(groups[role]);
  box.innerHTML="";
  selected.map(id=>players.find(p=>p.id===id))
    .filter(p=>p.role===role)
    .forEach(p=>{
      const slot=document.createElement("div");
      slot.className="slot";
      const emoji=document.createElement("span");
      emoji.textContent=p.icon;
      const name=document.createElement("b");
      name.textContent=p.name;
      slot.append(emoji,name);
      box.appendChild(slot);
    });
 });
}

function render() {
 const count=selected.length;
 const credits=selected.reduce((sum,id)=>sum+players.find(p=>p.id===id).credit,0);
 document.getElementById("playerCount").textContent=count+"/11";
 document.getElementById("creditsLeft").textContent=(100-credits).toFixed(1);
 document.getElementById("footerCount").textContent=count+" / 11 Players";
 document.getElementById("progressBar").style.width=(count/11*100)+"%";
 document.getElementById("saveButton").disabled=count!==11;
 renderGround();
 renderPlayers();
}

function saveTeam() {
 if(selected.length!==11) return;
 const teamPlayers=selected.map(id=>players.find(p=>p.id===id));
 const saved={
  id:Date.now(),
  match:match,
  players:teamPlayers,
  createdAt:new Date().toISOString()
 };

 let teams=[];
 try {
  teams=JSON.parse(localStorage.getItem("team11_teams")||"[]");
  if(!Array.isArray(teams)) teams=[];
 } catch(e) {teams=[];}

 teams.push(saved);
 localStorage.setItem("team11_teams",JSON.stringify(teams));
 alert("Team saved successfully!");
 window.location.href="index.html";
}

render();
</script>
</body>
</html>
